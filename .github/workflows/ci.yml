name: GeoSlope Review - CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Calidad, seguridad y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .
          python -m pip check

      - name: Verificar calidad con Ruff
        run: python -m ruff check .

      - name: Analizar seguridad con Bandit
        run: python -m bandit -r gsreview -ll

      - name: Auditar dependencias
        run: python -m pip_audit -r requirements.txt

      - name: Preparar artefactos originales
        run: |
          mkdir -p ../config ../data/processed ../models ../reports
          cp -a ci_artifacts/. ../
          python scripts/verify_integrity.py

      - name: Ejecutar pruebas y cobertura
        run: |
          python -m pytest -q tests \
            --junitxml=pytest-results.xml \
            --cov=gsreview \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoslope-test-results
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: warn
