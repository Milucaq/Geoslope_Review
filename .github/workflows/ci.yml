name: GeoSlope Review - CI

on:
  push:
    branches:
      - main
      - develop
      - 'feature/**'
  pull_request:
    branches:
      - main
      - develop
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  code-quality:
    name: 1. Calidad y Estilo (Ruff)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar linter Ruff
        run: |
          python -m pip install --upgrade pip
          python -m pip install ruff

      - name: Ejecutar análisis estático de estilo y sintaxis
        run: |
          errors=0
          echo "=== [1/2] Verificando reglas de estilo y calidad con Ruff ==="
          if ! python -m ruff check --output-format=full .; then
            echo "::error::Ruff detectó incumplimientos de estilo o calidad de código."
            errors=$((errors + 1))
          fi

          echo "=== [2/2] Verificando compilación de sintaxis Python ==="
          if ! python -m compileall -q gsreview app.py scripts tests; then
            echo "::error::Fallo en compilación de sintaxis de módulos Python."
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::La etapa de Calidad y Estilo finalizó con $errors fallo(s)."
            exit 1
          fi

  security-audit:
    name: 2. Seguridad y Librerías (Bandit & pip-audit)
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias y herramientas de seguridad
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Ejecutar auditoría acumulada SAST, SCA e higiene de archivos
        run: |
          errors=0

          echo "=== [1/4] Verificando consistencia del árbol de paquetes (pip check) ==="
          if ! python -m pip check; then
            echo "::error::Se detectaron conflictos o dependencias faltantes con pip check."
            errors=$((errors + 1))
          fi

          echo "=== [2/4] Verificando ausencia de secretos y archivos prohibidos en Git ==="
          forbidden=$(git ls-files | grep -E '(\.env$|\.sqlite3$|\.db$|\.gsbackup$|\.pem$|\.key$)' || true)
          if [ -n "$forbidden" ]; then
            echo "::error::Archivos sensibles o bases de datos locales versionadas en Git: $forbidden"
            errors=$((errors + 1))
          else
            echo "Higiene de repositorio verificada: sin secretos ni bases de datos expuestas."
          fi

          echo "=== [3/4] Análisis estático de seguridad SAST (Bandit) ==="
          python -m bandit -r gsreview app.py scripts -ll -f json -o bandit-report.json || true
          if ! python -m bandit -r gsreview app.py scripts -ll; then
            echo "::error::Bandit detectó hallazgos de seguridad de severidad media o alta."
            errors=$((errors + 1))
          fi

          echo "=== [4/4] Auditoría de vulnerabilidades en librerías (pip-audit) ==="
          python -m pip_audit -r requirements.txt -f json -o pip-audit-report.json || true
          if ! python -m pip_audit -r requirements.txt; then
            echo "::error::pip-audit detectó vulnerabilidades conocidas (CVE) en las librerías."
            errors=$((errors + 1))
          fi

          if [ "$errors" -gt 0 ]; then
            echo "::error::La etapa de Seguridad y Librerías acumuló $errors bloque(s) con errores."
            exit 1
          fi

      - name: Guardar reportes de seguridad
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoslope-security-reports
          path: |
            bandit-report.json
            pip-audit-report.json
          if-no-files-found: warn

  artifact-integrity:
    name: 3. Integridad de Artefactos (SHA-256)
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias base
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install -e .

      - name: Verificar integridad criptográfica de artefactos congelados
        run: |
          mkdir -p ../config ../data/processed ../models ../reports
          cp -a ci_artifacts/. ../
          python scripts/verify_integrity.py

  unit-domain-tests:
    name: 4. Pruebas Unitarias, Dominio y Seguridad
    needs:
      - code-quality
      - security-audit
      - artifact-integrity
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias de pruebas
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Preparar artefactos originales
        run: |
          mkdir -p ../config ../data/processed ../models ../reports
          cp -a ci_artifacts/. ../

      - name: Ejecutar pruebas unitarias, criptográficas y de datos
        run: |
          python -m pytest -v \
            tests/test_phase7_security.py \
            tests/test_csv_import.py \
            tests/test_login_theme.py \
            tests/test_hu*.py \
            --junitxml=pytest-unit-results.xml

  integration-coverage:
    name: 5. Integración, UI y Cobertura (>= 90%)
    needs:
      - code-quality
      - security-audit
      - artifact-integrity
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt

      - name: Instalar dependencias de pruebas y cobertura
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip install -e .

      - name: Preparar artefactos originales
        run: |
          mkdir -p ../config ../data/processed ../models ../reports
          cp -a ci_artifacts/. ../
          python scripts/verify_integrity.py

      - name: Ejecutar suite integral y validar umbral de cobertura
        run: |
          python -m pytest -q tests \
            --junitxml=pytest-results.xml \
            --cov=gsreview \
            --cov-report=xml:coverage.xml \
            --cov-report=term-missing \
            --cov-fail-under=90

      - name: Guardar evidencias de pruebas y cobertura
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: geoslope-test-results
          path: |
            pytest-results.xml
            coverage.xml
          if-no-files-found: warn

  quality-gate:
    name: 6. Compuerta de Calidad (Resumen Acumulado)
    needs:
      - code-quality
      - security-audit
      - artifact-integrity
      - unit-domain-tests
      - integration-coverage
    if: always() && !cancelled()
    runs-on: ubuntu-latest
    timeout-minutes: 5

    env:
      RES_QUALITY: ${{ needs.code-quality.result }}
      RES_SECURITY: ${{ needs.security-audit.result }}
      RES_INTEGRITY: ${{ needs.artifact-integrity.result }}
      RES_UNIT: ${{ needs.unit-domain-tests.result }}
      RES_INTEGRATION: ${{ needs.integration-coverage.result }}

    steps:
      - name: Consolidar resultados y publicar resumen ejecutivo
        run: |
          badge() {
            if [ "$1" = "success" ]; then
              echo "✅ Aprobado"
            else
              echo "❌ Fallido ($1)"
            fi
          }

          {
            echo "## 📊 Resumen Acumulado del Pipeline CI — GeoSlope Review"
            echo ""
            echo "| Etapa del Pipeline | Herramientas / Alcance | Estado |"
            echo "| :--- | :--- | :---: |"
            echo "| **1. Calidad y Estilo** | Ruff Linter + Compilación de sintaxis Python | $(badge "$RES_QUALITY") |"
            echo "| **2. Seguridad y Librerías** | Bandit (SAST) + pip-audit (SCA) + pip check + Higiene Git | $(badge "$RES_SECURITY") |"
            echo "| **3. Integridad Criptográfica** | Verificación SHA-256 de 17 artefactos congelados | $(badge "$RES_INTEGRITY") |"
            echo "| **4. Pruebas Unitarias y Dominio** | Seguridad Argon2id/AES-GCM/TOTP, CSV, Sintéticos y Tema | $(badge "$RES_UNIT") |"
            echo "| **5. Integración, UI y Cobertura** | Suite completa Pytest + AppTest + Cobertura >= 90% | $(badge "$RES_INTEGRATION") |"
            echo ""
          } >> "$GITHUB_STEP_SUMMARY"

          failed=0
          for pair in \
            "1. Calidad y Estilo:$RES_QUALITY" \
            "2. Seguridad y Librerías:$RES_SECURITY" \
            "3. Integridad de Artefactos:$RES_INTEGRITY" \
            "4. Pruebas Unitarias y Dominio:$RES_UNIT" \
            "5. Integración, UI y Cobertura:$RES_INTEGRATION"; do
            stage="${pair%%:*}"
            status="${pair##*:}"
            if [ "$status" != "success" ]; then
              echo "::error::Etapa fallida en el pipeline acumulado: $stage (estado: $status)"
              failed=$((failed + 1))
            else
              echo "Etapa aprobada: $stage"
            fi
          done

          if [ "$failed" -gt 0 ]; then
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ❌ **Resultado Global:** Se detectaron fallos en **$failed** etapa(s). Revisa el detalle de cada bloque arriba." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          else
            echo "" >> "$GITHUB_STEP_SUMMARY"
            echo "> ✅ **Resultado Global:** Todas las etapas de calidad, seguridad, integridad y cobertura finalizaron exitosamente." >> "$GITHUB_STEP_SUMMARY"
          fi
