services:
  - type: web
    name: geoslope-review
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && pip install -e .
    startCommand: python render_start.py
    envVars:
      - key: PYTHON_VERSION
        value: "3.13.14"
      - key: PYTHONUNBUFFERED
        value: "1"
      - key: GEOSLOPE_SETUP_KEY
        sync: false