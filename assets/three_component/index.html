<!doctype html>
<html lang="es">
<head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>GeoSlope Review | Relieve 3D</title>
<style>
*{box-sizing:border-box}html,body{margin:0;overflow:hidden;background:#122232;color:#e2e8f0;font-family:system-ui,sans-serif}
#scene{height:540px;position:relative;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}
#header{position:absolute;left:16px;top:14px;z-index:2;pointer-events:none;background:#122232dd;padding:10px 14px;border-radius:8px}
#header strong{font-size:15px}#status{display:block;font-size:12px;color:#cbd5e1;margin-top:3px}
#tools{position:absolute;right:12px;top:12px;z-index:3;display:flex;gap:8px}button{border:1px solid #64748b;background:#1e293b;color:#fff;border-radius:6px;padding:8px;cursor:pointer}
#legend{position:absolute;bottom:12px;left:14px;background:#122232dd;border-radius:6px;padding:8px 10px;font-size:11px;pointer-events:none}
#legend i{display:block;width:150px;height:7px;margin:5px 0;background:linear-gradient(to right,#55463d,#9e8163,#d2c1a1)}
#limits{display:flex;justify-content:space-between}
</style></head>
<body><main id="scene"><div id="header"><strong>Century Mine · relieve topográfico</strong><span id="status">Esperando datos verificados…</span></div>
<div id="tools"><button id="reset">Restablecer cámara</button><button id="full">Pantalla completa</button></div>
<div id="legend">Elevación EGM2008 (m)<i></i><div id="limits"><span id="lo"></span><span id="hi"></span></div></div></main>
<script type="module" src="/src/main.js"></script></body></html>
