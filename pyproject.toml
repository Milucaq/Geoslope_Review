[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geoslope-review"
version = "0.7.5"
description = "Aplicacion de revision de anomalias estadisticas"
requires-python = ">=3.11"

[tool.setuptools.packages.find]
include = ["gsreview", "gsreview.*"]
exclude = ["tests", "tests.*"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
ignore = ["E402"]

[tool.pytest.ini_options]
testpaths = ["tests"]
